<!DOCTYPE html>
<html lang="de">

<style>
:root{
  --bg:#E4E8EF;--ink:#1B2238;--muted:#5A6378;--panel:#F5F7FA;--line:#C5CCD8;
  --gold:#E3B341;--crown-line:#6B4A0E;--edge:#1B2238;--thin:rgba(27,34,56,.18);
  --hint:#2F6FDB;--cellbg:#F7F8FB;--givenbg:#DDE2EA;--path:#3E63DD;--pathbg:rgba(62,99,221,.16);--edge-w:1.5px;--thin-w:.5px;--x:#1B2238;--bad:#C4302B;--accent:#1B2238;--on-accent:#F5F7FA;
  --serif:"Young Serif",Georgia,"Times New Roman",serif;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121827;--ink:#E7EAF0;--muted:#98A2B8;--panel:#1C2336;--line:#2E3750;--edge:#0B0F1A;--thin:rgba(11,15,26,.25);--accent:#E3B341;--on-accent:#1B2238;--hint:#7FB0FF;--cellbg:#232B40;--givenbg:#343E5C;--path:#7C9BFF;--pathbg:rgba(124,155,255,.2);
}}
:root[data-theme="dark"]{--bg:#121827;--ink:#E7EAF0;--muted:#98A2B8;--panel:#1C2336;--line:#2E3750;--edge:#0B0F1A;--thin:rgba(11,15,26,.25);--accent:#E3B341;--on-accent:#1B2238;--hint:#7FB0FF;--cellbg:#232B40;--givenbg:#343E5C;--path:#7C9BFF;--pathbg:rgba(124,155,255,.2)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-tap-highlight-color:transparent}
main{max-width:520px;margin:0 auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;gap:10px}
h1{font:400 2rem/1 var(--serif);margin:0;flex:1;letter-spacing:-.01em}
h1 svg{width:.8em;height:.8em;vertical-align:-.04em;margin-right:.22em}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);display:grid;place-items:center;cursor:pointer;font:700 1.05rem var(--sans)}
.icon-btn svg{width:20px;height:20px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;color:var(--muted);font:500 .95rem var(--sans);padding:9px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.status{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
#label{font-weight:500}
#timer{font:400 1.9rem/1 var(--serif);font-variant-numeric:tabular-nums}
#board{--n:8;position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));grid-template-rows:repeat(var(--n),minmax(0,1fr));width:100%;aspect-ratio:1;border:2px solid var(--edge);border-radius:6px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--panel)}
.building{grid-column:1/-1;align-self:center;text-align:center;color:var(--muted);margin:0}
.cell{position:relative;padding:0;margin:0;border-radius:0;cursor:pointer;display:grid;place-items:center;min-width:0;min-height:0;font:inherit;color:var(--x)}
.cell:focus-visible{outline:3px solid var(--accent);outline-offset:-4px;z-index:1}
.cell svg{position:absolute;left:14%;top:14%;width:72%;height:72%;pointer-events:none;filter:drop-shadow(0 1px 0 rgba(0,0,0,.18))}
.cell[data-s="x"]::before,.cell[data-s="x"]::after,.cell[data-s="auto"]::before,.cell[data-s="auto"]::after{content:"";position:absolute;width:30%;height:2px;border-radius:2px;background:var(--x);opacity:.6}
.cell[data-s="x"]::before,.cell[data-s="auto"]::before{transform:rotate(45deg)}
.cell[data-s="x"]::after,.cell[data-s="auto"]::after{transform:rotate(-45deg)}
.cell[data-s="auto"]::before,.cell[data-s="auto"]::after{opacity:.22}
.cell[data-s="gx"]::before,.cell[data-s="gx"]::after{content:"";position:absolute;width:34%;height:3px;border-radius:2px;background:var(--hint)}
.cell[data-s="gx"]::before{transform:rotate(45deg)}.cell[data-s="gx"]::after{transform:rotate(-45deg)}
.cell[data-s="gc"] svg{opacity:.5}
.cell.tgt{box-shadow:inset 0 0 0 3px var(--hint);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:inset 0 0 0 5px var(--hint)}}
.cell.dim{filter:saturate(.6) brightness(.9)}
#hintBox{background:var(--panel);border:1px solid var(--hint);border-radius:12px;padding:14px}
#hintBox p{margin:0 0 12px}
#hintBox .dlg-actions{margin-top:0}
.games{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.games button{display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font:500 .85rem var(--sans);padding:10px 4px;border-radius:12px;cursor:pointer}
.games button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.gi svg{width:26px;height:26px;display:block}
.g-tango .cell,.g-zip .cell{background:var(--cellbg);border:var(--thin-w) solid var(--line)}
.g-tango .cell.given{background:var(--givenbg);cursor:default}
.g-tango .cell svg{left:18%;top:18%;width:64%;height:64%}
.cell[data-s="gs"] svg,.cell[data-s="gm"] svg{opacity:.45}
.sign{position:absolute;z-index:2;transform:translate(-50%,-50%);width:clamp(15px,4.4vw,20px);height:clamp(15px,4.4vw,20px);border-radius:50%;background:var(--panel);border:1px solid var(--line);color:var(--ink);display:grid;place-items:center;font:700 clamp(11px,3.2vw,14px)/1 var(--sans);pointer-events:none}
.sign.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.g-zip .cell.on{background:var(--pathbg)}
.zsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.zpath{fill:none;stroke:var(--path);stroke-width:.4;stroke-linecap:round;stroke-linejoin:round}
.zghost{fill:none;stroke:var(--hint);stroke-width:.16;stroke-dasharray:.18 .16;stroke-linecap:round;stroke-linejoin:round}
.walls line{stroke:var(--ink);stroke-width:.1;stroke-linecap:round}
.num circle{fill:var(--ink)}
.num text{fill:var(--bg);font:700 .34px var(--sans);text-anchor:middle;dominant-baseline:central}
#board.win .zpath{animation:glow 1s ease-in-out 2}
@keyframes glow{50%{stroke-width:.55}}
.cell.bad{background-image:repeating-linear-gradient(135deg,rgba(196,48,43,.35) 0 4px,transparent 4px 9px)!important}
.cell.bad svg{--gold:#E86A5F;--crown-line:#7A1712}
.cell.flash{animation:flash 1.1s ease-out}
@keyframes flash{0%{box-shadow:inset 0 0 0 4px var(--ink)}100%{box-shadow:inset 0 0 0 0 transparent}}
#board.win .cell[data-s="crown"] svg{animation:rise .5s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--row)*90ms)}
@keyframes rise{0%{transform:scale(1)}45%{transform:scale(1.28) translateY(-8%)}100%{transform:scale(1)}}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;gap:12px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:500 1rem var(--sans);padding:12px;border-radius:12px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.icon-btn:focus-visible,.seg button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#note{color:var(--muted);font-size:.9rem;margin:0;text-align:center}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink);padding:22px;width:min(92vw,420px);max-height:85vh}
dialog::backdrop{background:rgba(10,14,25,.55)}
dialog h2{font:400 1.5rem/1.2 var(--serif);margin:0 0 12px}
dialog p,dialog li{margin:0 0 8px}
dialog ul{padding-left:1.2em;margin:0 0 12px}
.big{font:400 3.2rem/1 var(--serif);font-variant-numeric:tabular-nums;margin:4px 0 14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row small{display:block;color:var(--muted)}
table{width:100%;border-collapse:collapse;margin:6px 0 12px;font-variant-numeric:tabular-nums}
td{padding:5px 0;border-bottom:1px solid var(--line)}td+td{text-align:right}
h3{font-size:1rem;margin:16px 0 4px}
.switch{appearance:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.switch:checked{background:var(--accent)}.switch:checked::after{transform:translateX(18px)}
.danger{color:var(--bad)}
.dlg-actions{display:flex;gap:10px;margin-top:16px}.dlg-actions .btn{flex:1}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <h1 id="gameName"></h1>
    <button class="icon-btn" id="rulesBtn" aria-label="Spielregeln">?</button>
    <button class="icon-btn" id="setBtn" aria-label="Einstellungen und Statistik"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
  </header>
  <nav class="games" aria-label="Spiel wählen">
    <button data-game="queens"><span class="gi" id="giQ"></span>Krönchen</button>
    <button data-game="tango"><span class="gi" id="giT"></span>Sonne &amp; Mond</button>
    <button data-game="zip"><span class="gi" id="giZ"></span>Linienzug</button>
  </nav>
  <div class="seg" role="group" aria-label="Spielmodus">
    <button data-mode="level">Level</button>
    <button data-mode="daily">Tägliches Rätsel</button>
  </div>
  <div class="status"><span id="label"></span><span id="timer" aria-label="Zeit">00:00</span></div>
  <div id="board"></div>
  <div class="meta"><span id="progress"></span><span id="tip"></span></div>
  <div class="tools">
    <button class="btn" id="hint">Hinweis</button>
    <button class="btn" id="reset">Brett leeren</button>
  </div>
  <div id="hintBox" hidden role="status" aria-live="polite">
    <p id="hintText"></p>
    <div class="dlg-actions"><button class="btn" id="hintHide">Ausblenden</button><button class="btn primary" id="hintApply">Ausführen</button></div>
  </div>
  <p id="note"></p>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<dialog id="winDlg">
  <h2 id="winTitle">Gelöst</h2>
  <div class="big" id="winTime"></div>
  <div id="winText"></div>
  <div class="dlg-actions"><button class="btn" id="winAlt">Schließen</button><button class="btn primary" id="winBtn">Weiter</button></div>
</dialog>

<dialog id="rulesDlg">
  <h2 id="rulesTitle">Regeln</h2>
  <div id="rulesBody"></div>
  <div class="dlg-actions"><button class="btn primary" data-close>Los geht’s</button></div>
</dialog>

<dialog id="setDlg">
  <h2>Einstellungen</h2>
  <label class="row"><span>Auto-X bei Krönchen<small>Markiert Felder blass, die durch eine Krone gesperrt sind.</small></span><input type="checkbox" class="switch" id="autoX"></label>
  <h3 id="bestTitle">Bestzeiten</h3>
  <table id="bestTable"></table>
  <p id="stats" style="color:var(--muted);font-size:.9rem"></p>
  <div class="dlg-actions"><button class="btn danger" id="wipe">Zurücksetzen</button><button class="btn primary" data-close>Schließen</button></div>
</dialog>

<script>
// ===== Kern: Zufall, Generator, Löser =====
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(let k=0;k<s.length;k++){h^=s.charCodeAt(k);h=Math.imul(h,16777619)}return h>>>0}
function shuffle(a,rng){for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function nb4(i,n){const r=(i/n)|0,c=i%n,o=[];if(r>0)o.push(i-n);if(r<n-1)o.push(i+n);if(c>0)o.push(i-1);if(c<n-1)o.push(i+1);return o}

function genQueens(n,rng){
  const q=[],used=new Array(n).fill(false);
  (function bt(r){
    if(r===n)return true;
    for(const c of shuffle([...Array(n).keys()],rng)){
      if(used[c])continue;
      if(r>0&&Math.abs(c-q[r-1])<2)continue;
      used[c]=true;q[r]=c;
      if(bt(r+1))return true;
      used[c]=false;
    }
    return false;
  })(0);
  return q;
}

function growRegions(n,q,rng){
  const reg=new Array(n*n).fill(-1);
  for(let r=0;r<n;r++)reg[r*n+q[r]]=r;
  let left=n*n-n;
  while(left>0){
    const front=[];
    for(let i=0;i<n*n;i++){
      if(reg[i]!==-1)continue;
      const ns=nb4(i,n).filter(j=>reg[j]!==-1);
      if(ns.length)front.push([i,ns]);
    }
    const [i,ns]=front[Math.floor(rng()*front.length)];
    reg[i]=reg[ns[Math.floor(rng()*ns.length)]];left--;
  }
  return reg;
}

function findSolutions(n,reg,limit){
  const sols=[],col=new Array(n).fill(false),rg=new Array(n).fill(false),cur=[];
  (function bt(r){
    if(r===n){sols.push(cur.slice());return}
    for(let c=0;c<n;c++){
      if(col[c])continue;
      const g=reg[r*n+c];
      if(rg[g])continue;
      if(r>0&&Math.abs(c-cur[r-1])<2)continue;
      col[c]=rg[g]=true;cur[r]=c;
      bt(r+1);
      col[c]=rg[g]=false;
      if(sols.length>=limit)return;
    }
  })(0);
  return sols;
}

function connectedWithout(reg,n,a,skip){
  const cells=[];for(let i=0;i<n*n;i++)if(reg[i]===a&&i!==skip)cells.push(i);
  if(!cells.length)return false;
  const seen=new Set([cells[0]]),st=[cells[0]];
  while(st.length){const x=st.pop();for(const y of nb4(x,n))if(y!==skip&&reg[y]===a&&!seen.has(y)){seen.add(y);st.push(y)}}
  return seen.size===cells.length;
}

const PALETTE=['#F2B5A0','#B9D3A5','#A9C8E8','#E6D38A','#C7B3E3','#9ED6CC','#E8B4CF','#D6C2A8','#BFC6CF','#CDE08A'];

// Erzeugt ein Rätsel mit genau einer Lösung
function queensGenerate(n,rng){
  for(let attempt=0;attempt<300;attempt++){
    const q=genQueens(n,rng),reg=growRegions(n,q,rng);
    let ok=false;
    for(let it=0;it<500;it++){
      const sols=findSolutions(n,reg,2);
      if(sols.length===1){ok=true;break}
      const alt=sols.find(s=>s.some((c,r)=>c!==q[r]));
      const cand=shuffle(alt.map((c,r)=>r*n+c).filter((i,r)=>alt[r]!==q[r]),rng);
      let moved=false;
      for(const i of cand){
        const a=reg[i],ns=shuffle(nb4(i,n).filter(j=>reg[j]!==a),rng);
        if(!ns.length||!connectedWithout(reg,n,a,i))continue;
        reg[i]=reg[ns[0]];moved=true;break;
      }
      if(!moved)break;
    }
    if(ok)return{n,reg,sol:q,colors:shuffle(PALETTE.slice(),rng).slice(0,n)};
  }
  return null;
}
// ===== Sonne & Mond: Generator und Logik =====
function tLines(n){const L=[];for(let r=0;r<n;r++){const a=[];for(let c=0;c<n;c++)a.push(r*n+c);L.push(a)}for(let c=0;c<n;c++){const a=[];for(let r=0;r<n;r++)a.push(r*n+c);L.push(a)}return L}
function tSolution(n,rng){
  const g=new Array(n*n).fill(0),h=n/2;
  function ok(i,v){const r=(i/n)|0,c=i%n;
    if(c>=2&&g[i-1]===v&&g[i-2]===v)return false;
    if(r>=2&&g[i-n]===v&&g[i-2*n]===v)return false;
    let a=0;for(let k=0;k<c;k++)if(g[r*n+k]===v)a++;if(a>=h)return false;
    let b=0;for(let k=0;k<r;k++)if(g[k*n+c]===v)b++;if(b>=h)return false;
    return true}
  (function bt(i){if(i===n*n)return true;for(const v of shuffle([1,2],rng))if(ok(i,v)){g[i]=v;if(bt(i+1))return true;g[i]=0}return false})(0);
  return g;
}
const T_NAME={1:{pl:'Sonnen',art:'eine Sonne'},2:{pl:'Monde',art:'ein Mond'}};
function tValidLine(a,inner,h){
  let s=0;for(const x of a)if(x===1)s++;if(s!==h)return false;
  for(let p=0;p<a.length-2;p++)if(a[p]===a[p+1]&&a[p]===a[p+2])return false;
  for(const [p,q,t] of inner)if((a[p]===a[q])!==(t==='e'))return false;
  return true;
}
// Liefert den nächsten logischen Schritt oder null
function tStep(n,v,signs,lines,adv){
  const opp=x=>3-x,h=n/2,lineName=li=>li<n?'Zeile':'Spalte';
  for(const [a,b,t] of signs){
    for(const [x,y] of [[a,b],[b,a]])if(v[x]&&!v[y]){
      const val=t==='e'?v[x]:opp(v[x]);
      return{sets:[[y,val]],hl:[a,b],text:t==='e'?'Das = verlangt auf beiden Seiten dasselbe Symbol.':'Das × verlangt auf beiden Seiten verschiedene Symbole.'};
    }
  }
  for(const L of lines){
    for(let p=0;p<n-1;p++){const x=v[L[p]];if(x&&v[L[p+1]]===x){const s=[];
      if(p>0&&!v[L[p-1]])s.push([L[p-1],opp(x)]);if(p+2<n&&!v[L[p+2]])s.push([L[p+2],opp(x)]);
      if(s.length)return{sets:s,hl:[L[p],L[p+1]],text:'Zwei '+T_NAME[x].pl+' nebeneinander: Daneben muss jeweils '+T_NAME[opp(x)].art+' stehen, sonst wären es drei in Folge.'}}}
    for(let p=0;p<n-2;p++){const x=v[L[p]];if(x&&v[L[p+2]]===x&&!v[L[p+1]])
      return{sets:[[L[p+1],opp(x)]],hl:[L[p],L[p+2]],text:'Zwischen zwei '+T_NAME[x].pl+' muss '+T_NAME[opp(x)].art+' stehen, sonst wären es drei in Folge.'}}
  }
  for(let li=0;li<lines.length;li++){const L=lines[li];
    for(const x of [1,2]){const cnt=L.filter(i=>v[i]===x).length,emp=L.filter(i=>!v[i]);
      if(cnt===h&&emp.length)return{sets:emp.map(i=>[i,opp(x)]),hl:L,text:'Diese '+lineName(li)+' hat schon '+h+' '+T_NAME[x].pl+'. Auf alle freien Felder kommt '+T_NAME[opp(x)].art+'.'}}}
  if(adv)for(let li=0;li<lines.length;li++){
    const L=lines[li],emp=[];L.forEach((i,p)=>{if(!v[i])emp.push(p)});
    if(!emp.length)continue;
    const inner=signs.filter(([a,b])=>L.includes(a)&&L.includes(b)).map(([a,b,t])=>[L.indexOf(a),L.indexOf(b),t]);
    let common=null;
    for(let m=0;m<(1<<emp.length);m++){
      const arr=L.map(i=>v[i]);emp.forEach((p,k)=>arr[p]=(m>>k&1)?1:2);
      if(!tValidLine(arr,inner,h))continue;

function ek(a,b){return a<b?a*1000+b:b*1000+a}

  let path=[];for(let r=0;r<n;r++)for(let c=0;c<n;c++)path.push(r*n+(r%2?n-1-c:c));
  const it=n*n*40;

    if(idx===path.length-2)continue;

}
function zCount(n,nums,K,walls,limit,budget){
  const N=n*n,adj=[];

  let start=-1,end=-1;for(let i=0;i<N;i++){if(nums[i]===1)start=i;if(nums[i]===K)end=i}
  const vis=new Uint8Array(N),path=[start],sols=[];let nodes=0,over=false;vis[start]=1;

    const rem=N-cnt;if(!rem)return true;

    seen.fill(0);st.length=0;st.push(end);seen[end]=1;let c=1;
    while(st.length){const x=st.pop();for(const y of adj[x])if(!vis[y]&&!seen[y]){seen[y]=1;c++;st.push(y)}}
    return c===rem;
  }

    if(++nodes>budget){over=true;return}
    if(cnt===N){if(next>K)sols.push(path.slice());return}
    for(const y of adj[cur]){

function zipGenerate(n,rng){
  const N=n*n;
  for(let attempt=0;attempt<60;attempt++){
    const path=zHamPath(n,rng),idxs=new Set([0,N-1]),walls=new Set();
    const extra=Math.max(1,Math.round(N/10));
    while(idxs.size<2+extra)idxs.add(1+Math.floor(rng()*(N-2)));
    let res,nums,K;
    for(let it=0;it<80;it++){
      const sorted=[...idxs].sort((a,b)=>a-b);K=sorted.length;nums=new Array(N).fill(0);
      sorted.forEach((d,k)=>nums[path[d]]=k+1);
      res=zCount(n,nums,K,walls,2,60000);
      if(res.status==='unique')break;
      if(res.status==='multi'){
        const alt=res.sols.find(s=>s.some((c,k)=>c!==path[k]));let d=0;while(alt[d]===path[d])d++;
        if(rng()<.45)walls.add(ek(alt[d-1],alt[d]));else idxs.add(d);

  }
  return null;
}

      return{text:st.text,hl:st.hl.concat(tgt),tgt,sets:st.sets,label:'Setzen',apply:()=>{for(const [i,v] of st.sets)S.marks[i]=v}}}
    const i=S.marks.findIndex(x=>!x);
    return{text:'Hier gibt es keinen einfachen nächsten Schritt mehr. Dieses Feld ist aufgedeckt.',hl:[i],tgt:[i],sets:[[i,S.sol[i]]],label:'Setzen',apply:()=>{S.marks[i]=S.sol[i]}};
  }
};

// ===== Spiel 3: Linienzug =====
const Zip={
  id:'zip',name:'Linienzug',prefix:'zp',icon:PATHICON,tip:'Von der 1 aus ziehen',resetLabel:'Linie löschen',
  rules:`<ul><li>Zieh eine Linie von der 1 bis zur höchsten Zahl.</li><li>Die Zahlen werden der Reihe nach besucht.</li><li>Die Linie läuft durch jedes Feld genau einmal.</li><li>Dicke Striche sind Wände, durch die die Linie nicht darf.</li></ul>
  <p>Zieh mit dem Finger von der 1 aus. Fährst du zurück, wird die Linie zurückgenommen. Tippen auf ein Feld der Linie kürzt sie bis dorthin.</p>`,
  levelParams:l=>({n:l<=4?5:l<=12?6:l<=25?7:8}),
  dailyParams:d=>({n:[7,6,6,6,7,7,7][d.getDay()]}),
  create(p,rng){const g=zipGenerate(p.n,rng);return{n:p.n,sol:g.sol,nums:g.nums,K:g.K,walls:g.walls,path:[]}},
  label:s=>sz(s.n),bestKey:s=>String(s.n),bestKeys:['5','6','7','8'],bestLabel:k=>sz(+k),
  wallSet:new Set(),
  build(){
    const n=S.n;board.innerHTML='';this.wallSet=new Set(S.walls.map(([a,b])=>ek(a,b)));
    for(let i=0;i<n*n;i++){const[r,c]=rc(i),d=document.createElement('button');
      d.className='cell';d.dataset.i=i;d.setAttribute('aria-label','Zeile '+(r+1)+', Spalte '+(c+1)+(S.nums[i]?', Zahl '+S.nums[i]:''));board.appendChild(d)}
    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('viewBox','0 0 '+n+' '+n);svg.setAttribute('class','zsvg');svg.setAttribute('aria-hidden','true');
    let w='';for(const [a,b] of S.walls){const[r,c]=rc(a);
      w+=b===a+1?`<line x1="${c+1}" y1="${r}" x2="${c+1}" y2="${r+1}"/>`:`<line x1="${c}" y1="${r+1}" x2="${c+1}" y2="${r+1}"/>`}
    let nm='';for(let i=0;i<n*n;i++)if(S.nums[i]){const[r,c]=rc(i);
      nm+=`<g class="num"><circle cx="${c+.5}" cy="${r+.5}" r=".31"/><text x="${c+.5}" y="${r+.5}">${S.nums[i]}</text></g>`}
    svg.innerHTML=`<polyline class="zghost" points=""/><polyline class="zpath" points=""/><g class="walls">${w}</g>${nm}`;
    board.appendChild(svg);
  },
  pts(list){return list.map(i=>{const[r,c]=rc(i);return(c+.5)+','+(r+.5)}).join(' ')},
  paint(){
    const P=S.path,on=new Set(P);
    board.querySelectorAll('.cell').forEach((el,i)=>{const tg=H&&H.tgt.has(i);
      el.classList.toggle('on',on.has(i));el.classList.toggle('tgt',!!tg);el.classList.remove('dim')});
    board.querySelector('.zpath').setAttribute('points',this.pts(P.length===1?[P[0],P[0]]:P));
    const g=H&&H.seg?(P.length?[P[P.length-1]]:[]).concat(H.seg):[];
    board.querySelector('.zghost').setAttribute('points',this.pts(g.length===1?[g[0],g[0]]:g));
  },
  progress(){return S.path.length+' von '+S.n*S.n+' Feldern'},
  next(){let m=0;for(const c of S.path)if(S.nums[c])m=S.nums[c];return m+1},
  extend(i){
    const P=S.path;if(!P.length){if(S.nums[i]===1)P.push(i);return}
    const last=P[P.length-1];
    if(P.includes(i)||!near(last,i)||this.wallSet.has(ek(last,i))||S.nums[last]===S.K)return;
    const k=S.nums[i];if(k&&k!==this.next())return;
    P.push(i);
  },
  down(i){const P=S.path,idx=P.indexOf(i);if(idx>=0)P.length=idx+1;else this.extend(i);paint()},
  move(i){const P=S.path;if(P.length>=2&&i===P[P.length-2])P.pop();else this.extend(i);paint()},
  up(){},
  key(i){this.down(i)},
  won(){return S.path.length===S.n*S.n&&S.nums[S.path[S.path.length-1]]===S.K},
  clear(){S.path=[]},
  hint(){
    const P=S.path,sol=S.sol;let d=0;while(d<P.length&&P[d]===sol[d])d++;
    if(d<P.length){const rest=P.slice(d);
      return{text:'Ab dem markierten Feld weicht deine Linie von der Lösung ab.',hl:rest,tgt:[P[d]],label:'Zurücknehmen',apply:()=>{S.path.length=d}}}
    const seg=[];for(let k=P.length;k<sol.length&&seg.length<5;k++){seg.push(sol[k]);if(k>0&&S.nums[sol[k]])break}
    return{text:P.length?'So geht es weiter: Folge der gestrichelten Linie.':'Starte bei der 1 und folge der gestrichelten Linie.',hl:seg,tgt:seg,seg,label:'Linie ziehen',apply:()=>{S.path.push(...seg)}};
  }
};

const GAMES={queens:Queens,tango:Tango,zip:Zip};
G=GAMES[store.get('rk_game','queens')]||Queens;
const K=k=>G.prefix+'_'+k;
const getProg=()=>store.get(K('progress'),{level:1});

// ---- Timer ----
function elapsedNow(){return S?S.elapsed+(runStart!==null?Date.now()-runStart:0):0}
function startTimer(){if(S&&!S.solved&&runStart===null&&!document.hidden)runStart=Date.now()}
function pauseTimer(){if(runStart!==null&&S){S.elapsed+=Date.now()-runStart}runStart=null}
setInterval(()=>{if(S)$('#timer').textContent=fmt(elapsedNow())},250);
document.addEventListener('visibilitychange',()=>{if(document.hidden){pauseTimer();save()}else startTimer()});
window.addEventListener('pagehide',()=>{pauseTimer();save()});

function save(){if(!S)return;store.set(K(S.mode==='level'?'game_level':'game_daily'),{...S,elapsed:elapsedNow()})}

function loadGame(){
  pauseTimer();S=null;hideHint(true);
  board.className='g-'+G.id;board.innerHTML='<p class="building">Rätsel wird gebaut …</p>';
  setTimeout(()=>{
    const prog=getProg();
    if(mode==='level'){
      const g=store.get(K('game_level'),null);
      if(g&&g.level===prog.level&&!g.solved)S=g;
      else S={mode:'level',level:prog.level,...G.create(G.levelParams(prog.level),mulberry32((Math.random()*4294967296)>>>0)),elapsed:0,hints:0,solved:false};
    }else{
      const key=dayKey(),g=store.get(K('game_daily'),null);
      if(g&&g.day===key)S=g;
      else S={mode:'daily',day:key,...G.create(G.dailyParams(new Date()),mulberry32(hashStr(G.id+'-'+key))),elapsed:0,hints:0,solved:false};
    }
    save();board.style.setProperty('--n',S.n);G.build();paint();updateHeader();startTimer();
  },30);
}

function paint(){if(!S)return;G.paint();$('#progress').textContent=G.progress()}

function streak(){const log=store.get(K('daily'),{});let d=new Date(),n=0;
  if(!log[dayKey(d)])d.setDate(d.getDate()-1);while(log[dayKey(d)]){n++;d.setDate(d.getDate()-1)}return n}

function updateHeader(){
  $('#gameName').innerHTML=G.icon+G.name;document.title=G.name+' | Rätselkiste';
  document.querySelectorAll('.games button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.game===G.id));
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));
  $('#tip').textContent=G.tip;$('#reset').textContent=G.resetLabel;
  if(!S)return;
  $('#label').textContent=S.mode==='level'?'Level '+S.level+', '+G.label(S):new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'})+', '+G.label(S);
  const best=store.get(K('best'),{}),bk=G.bestKey(S),note=$('#note');
  if(S.mode==='daily'&&S.solved)note.textContent='Heute gelöst in '+fmt(S.elapsed)+'. Morgen gibt es ein neues Rätsel.';
  else if(S.mode==='level')note.textContent=best[bk]?'Bestzeit '+G.bestLabel(bk)+': '+fmt(best[bk]):'Noch keine Bestzeit für '+G.bestLabel(bk);
  else{const st=streak();note.textContent=st?'Tägliche Serie: '+st+(st===1?' Tag':' Tage'):'Jeden Tag ein neues Rätsel, für alle gleich.'}
  const hb=$('#hint');
  if(S.solved&&S.mode==='level'){hb.disabled=false;hb.textContent='Level '+getProg().level+' starten'}
  else{hb.disabled=S.solved;hb.textContent='Hinweis'}
  $('#reset').disabled=S.solved;
}

// ---- Eingabe ----
const cellAt=(x,y)=>{const el=document.elementFromPoint(x,y),c=el&&el.closest?el.closest('.cell'):null;return c&&board.contains(c)?+c.dataset.i:-1};
board.addEventListener('pointerdown',e=>{
  const c=e.target.closest('.cell');if(!c||!S||S.solved)return;
  e.preventDefault();if(H)hideHint();dragging=true;G.down(+c.dataset.i);
});
window.addEventListener('pointermove',e=>{if(!dragging)return;const i=cellAt(e.clientX,e.clientY);if(i>=0)G.move(i)});
window.addEventListener('pointerup',()=>{if(!dragging)return;dragging=false;G.up();afterChange()});
window.addEventListener('pointercancel',()=>{if(!dragging)return;dragging=false;G.up();afterChange()});
board.addEventListener('keydown',e=>{
  const cell=e.target.closest('.cell');if(!cell||!S||S.solved)return;const i=+cell.dataset.i,n=S.n;
  if(e.key==='Enter'||e.key===' '){e.preventDefault();G.key(i);afterChange();return}
  const mv={ArrowUp:-n,ArrowDown:n,ArrowLeft:-1,ArrowRight:1}[e.key];
  if(mv!==undefined){e.preventDefault();const j=i+mv;if(j>=0&&j<n*n&&!(Math.abs(mv)===1&&((j/n)|0)!==((i/n)|0))){
    board.querySelectorAll('.cell')[j].focus();if(G.id==='zip'&&e.shiftKey){G.move(j);afterChange()}}}
});
board.addEventListener('click',e=>e.preventDefault());
function afterChange(){if(!S)return;startTimer();paint();if(!S.solved&&G.won())win();save()}

// ---- Hinweis ----
function hint(){
  if(!S)return;
  if(S.solved){if(S.mode==='level')loadGame();return}
  H=G.hint();H.hl=new Set(H.hl);H.tgt=new Set(H.tgt);
  S.elapsed+=PENALTY;S.hints++;
  $('#hintText').textContent=H.text;$('#hintApply').textContent=H.label;
  $('#hintBox').hidden=false;$('.tools').hidden=true;
  startTimer();paint();save();
}
function hideHint(silent){H=null;$('#hintBox').hidden=true;$('.tools').hidden=false;if(!silent)paint()}
function applyHint(){if(!H)return;H.apply();hideHint();afterChange()}

// ---- Gewonnen ----
let winA=()=>{},winB=()=>{};
function setWin(a,fa,b,fb){$('#winBtn').textContent=a;$('#winAlt').textContent=b;winA=fa;winB=fb}
function win(){
  pauseTimer();S.solved=true;
  const t=S.elapsed,lines=[],bk=G.bestKey(S);
  if(S.mode==='level'){
    const best=store.get(K('best'),{}),prev=best[bk];
    if(!prev||t<prev){best[bk]=t;store.set(K('best'),best);lines.push(prev?'Neue Bestzeit für '+G.bestLabel(bk)+'.':'Erste Bestzeit für '+G.bestLabel(bk)+'.')}
    else lines.push('Bestzeit '+G.bestLabel(bk)+': '+fmt(prev));
    const prog=getProg();prog.level++;store.set(K('progress'),prog);
    const nl=G.label(G.levelParams(prog.level));if(nl!==G.label(S))lines.push('Ab jetzt spielst du '+nl+'.');
    setWin('Level '+prog.level+' starten',()=>loadGame(),'Zum täglichen Rätsel',()=>setMode('daily'));
  }else{
    const log=store.get(K('daily'),{});log[S.day]={t,h:S.hints};store.set(K('daily'),log);
    const st=streak();lines.push('Tägliche Serie: '+st+(st===1?' Tag.':' Tage.'));
    setWin('Zum Level-Modus',()=>setMode('level'),'Schließen',()=>{});
  }
  if(S.hints)lines.push(S.hints+(S.hints===1?' Hinweis':' Hinweise')+' benutzt, das sind '+S.hints*15+' Sekunden Aufschlag.');
  save();paint();updateHeader();board.classList.add('win');
  $('#winTitle').textContent=G.name+' gelöst';$('#winTime').textContent=fmt(t);
  $('#winText').innerHTML=lines.map(l=>'<p>'+l+'</p>').join('');
  setTimeout(()=>{if(S&&S.solved)$('#winDlg').showModal()},matchMedia('(prefers-reduced-motion: reduce)').matches?200:S.n*90+500);
}
$('#winBtn').addEventListener('click',()=>{$('#winDlg').close();winA()});
$('#winAlt').addEventListener('click',()=>{$('#winDlg').close();winB()});
$('#winDlg').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close()});

function setMode(m){pauseTimer();save();mode=m;store.set('kr_mode',mode);loadGame()}
function setGame(id){pauseTimer();save();G=GAMES[id];store.set('rk_game',id);loadGame();updateHeader()}

// ---- Leisten, Dialoge ----
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600)}
$('#hint').addEventListener('click',hint);
$('#hintHide').addEventListener('click',()=>hideHint());
$('#hintApply').addEventListener('click',applyHint);
$('#reset').addEventListener('click',()=>{if(!S||S.solved)return;G.clear();afterChange();toast('Zurückgesetzt. Die Zeit läuft weiter.')});
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{
  if(b.dataset.mode===mode&&!(S&&S.solved&&mode==='level'))return;setMode(b.dataset.mode)}));
document.querySelectorAll('.games button').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.game!==G.id)setGame(b.dataset.game)}));
$('#rulesBtn').addEventListener('click',()=>{$('#rulesTitle').textContent='So wird '+G.name+' gespielt';
  $('#rulesBody').innerHTML=G.rules+'<p>Jedes Rätsel hat genau eine Lösung und lässt sich ohne Raten lösen. Ein Hinweis zeigt den nächsten logischen Schritt und kostet 15 Sekunden.</p>';$('#rulesDlg').showModal()});
$('#setBtn').addEventListener('click',()=>{renderSettings();$('#setDlg').showModal()});
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>b.closest('dialog').close()));
$('#autoX').addEventListener('change',e=>{settings.autoX=e.target.checked;store.set('kr_settings',settings);if(S)paint()});
$('#wipe').addEventListener('click',()=>{
  if(!confirm('Level, Bestzeiten und tägliche Serie von '+G.name+' wirklich löschen?'))return;
  ['progress','best','daily','game_level','game_daily'].forEach(k=>{try{localStorage.removeItem(K(k))}catch(e){}});
  runStart=null;S=null;$('#setDlg').close();loadGame();
});
function renderSettings(){
  $('#autoX').checked=settings.autoX;$('#bestTitle').textContent='Bestzeiten '+G.name;
  const best=store.get(K('best'),{});
  $('#bestTable').innerHTML=G.bestKeys.map(k=>'<tr><td>'+G.bestLabel(k)+'</td><td>'+(best[k]?fmt(best[k]):'–')+'</td></tr>').join('');
  $('#stats').textContent='Aktuelles Level: '+getProg().level+'. Tägliche Rätsel gelöst: '+Object.keys(store.get(K('daily'),{})).length+'. Serie: '+streak()+'.';
  $('#wipe').textContent=G.name+' zurücksetzen';
}
setInterval(()=>{if(S&&S.mode==='daily'&&S.day!==dayKey())loadGame()},60000);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
$('#giQ').innerHTML=CROWN;$('#giT').innerHTML=SUN;$('#giZ').innerHTML=PATHICON;
updateHeader();loadGame();

</script>
</body>
